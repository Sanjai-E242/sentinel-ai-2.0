name: Sentinel 2.0 CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Shared TypeScript Check & Build
        run: npm run build --workspace=@sentinel/shared

      - name: Backend TypeScript Check & Tests
        run: |
          npm run typecheck --workspace=@sentinel/backend
          npm test --workspace=@sentinel/backend
          npm run build --workspace=@sentinel/backend

      - name: Frontend TypeScript Check & Build
        run: |
          npm run typecheck --workspace=@sentinel/frontend
          npm test --workspace=@sentinel/frontend
          npm run build --workspace=@sentinel/frontend
